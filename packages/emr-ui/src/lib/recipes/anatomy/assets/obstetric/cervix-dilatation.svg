  <text x="97" y="490" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#475569" text-anchor="middle">1</text>
  <circle cx="145.5" cy="300" r="19" fill="none" stroke="#475569" stroke-width="6"/>
