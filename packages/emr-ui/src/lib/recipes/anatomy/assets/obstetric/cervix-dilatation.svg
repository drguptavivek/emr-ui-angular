  <path d="M299.5 352 L299.5 430" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="299.5" y="490" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#475569" text-anchor="middle">4</text>
  <circle cx="405" cy="300" r="47.5" fill="none" stroke="#475569" stroke-width="6"/>
  <path d="M405 361.5 L405 430" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="405" y="490" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#475569" text-anchor="middle">5</text>
  <circle cx="529.5" cy="300" r="57" fill="none" stroke="#475569" stroke-width="6"/>
