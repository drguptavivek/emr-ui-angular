  <title>Cervical dilatation circles from 1 to 10 cm, drawn in proportion</title>
  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="700" y="90" font-family="system-ui, sans-serif" font-size="34" fill="#475569" text-anchor="middle">Cervical dilatation (cm)</text>
