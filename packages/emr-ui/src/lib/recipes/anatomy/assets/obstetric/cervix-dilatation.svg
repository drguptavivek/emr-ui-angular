  <circle cx="213" cy="300" r="28.5" fill="none" stroke="#475569" stroke-width="6"/>
  <path d="M213 342.5 L213 430" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="213" y="490" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#475569" text-anchor="middle">3</text>
