  <circle cx="673" cy="300" r="66.5" fill="none" stroke="#475569" stroke-width="6"/>
  <path d="M673 380.5 L673 430" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="673" y="490" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#475569" text-anchor="middle">7</text>
  <circle cx="835.5" cy="300" r="76" fill="none" stroke="#475569" stroke-width="6"/>
  <path d="M835.5 390 L835.5 430" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/>
