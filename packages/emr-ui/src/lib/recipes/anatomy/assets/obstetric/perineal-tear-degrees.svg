  <text x="470" y="1105" font-family="system-ui, sans-serif" font-size="26" fill="#94a3b8" text-anchor="middle">Posterior (6 o'clock)</text>
  <text x="700" y="1165" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">Lithotomy: patient's right on the viewer's left. Classify by the deepest structure torn (RCOG / WHO).</text>
  <text x="900" y="1030" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8">EAS = external anal sphincter</text>
  <text x="900" y="1060" font-family="system-ui, sans-serif" font-size="22" fill="#94a3b8">IAS = internal anal sphincter</text>
  <text x="50" y="70" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#475569">R</text>
  <text x="1350" y="70" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#475569" text-anchor="end">L</text>
</svg>
