  <text x="900" y="170" font-family="system-ui, sans-serif" font-size="28" fill="#475569">1st degree</text>
  <text x="900" y="202" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">Vaginal epithelium and perineal skin only</text>
  <text x="900" y="300" font-family="system-ui, sans-serif" font-size="28" fill="#475569">2nd degree</text>
  <text x="900" y="332" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">Perineal muscles; anal sphincter intact</text>
  <text x="900" y="470" font-family="system-ui, sans-serif" font-size="28" fill="#475569">3a</text>
  <text x="900" y="502" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">EAS torn, less than 50% of thickness</text>
  <text x="900" y="600" font-family="system-ui, sans-serif" font-size="28" fill="#475569">3b</text>
  <text x="900" y="632" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">EAS torn, more than 50% of thickness</text>
  <text x="900" y="730" font-family="system-ui, sans-serif" font-size="28" fill="#475569">3c</text>
  <text x="900" y="762" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">EAS and internal anal sphincter (IAS) torn</text>
  <text x="900" y="870" font-family="system-ui, sans-serif" font-size="28" fill="#475569">4th degree</text>
  <text x="900" y="902" font-family="system-ui, sans-serif" font-size="24" fill="#94a3b8">EAS, IAS and anorectal mucosa torn</text>
