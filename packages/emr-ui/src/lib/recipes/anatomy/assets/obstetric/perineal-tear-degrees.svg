  <title>Perineal tear degrees, lithotomy schematic: skin and vaginal epithelium, perineal muscles, external anal sphincter 3a and 3b, internal anal sphincter 3c, anorectal mucosa 4th degree; anterior at the top, patient's right on the viewer's left</title>
