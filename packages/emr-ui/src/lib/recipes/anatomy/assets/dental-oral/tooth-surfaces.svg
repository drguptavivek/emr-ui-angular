  <rect x="360" y="360" width="280" height="280" rx="60" fill="none" stroke="#475569" stroke-width="6"/>
  <path d="M 232 232 L 378 378 M 768 232 L 622 378 M 232 768 L 378 622 M 768 768 L 622 622" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 10"/>
